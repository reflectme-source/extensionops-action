name: ExtensionOps Release Validation
description: Deterministic browser-extension release checks with JSON evidence on your GitHub runner.
author: ExtensionOps
branding:
  icon: shield
  color: blue
inputs:
  manifest-path:
    description: Optional path to manifest.json. Leave blank for auto-discovery.
    required: false
    default: ""
outputs:
  score:
    description: Release Confidence Score for checks executed by this action.
    value: ${{ steps.validate.outputs.score }}
  report:
    description: Path to the JSON evidence report.
    value: ${{ steps.validate.outputs.report }}
runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      env:
        EXTENSIONOPS_MANIFEST_PATH: ${{ inputs.manifest-path }}
      run: node "${{ github.action_path }}/validate.mjs"
